<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Butterfly Catcher</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a202c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #gameContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>
  <script type="module">
    import { ButterflyCatcherGame } from './butterfly-catcher/src/game.js';
    
    const game = new ButterflyCatcherGame();
    game.start();
  </script>
</body>
</html>
