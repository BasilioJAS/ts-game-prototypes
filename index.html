<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>TS Game Prototypes</title>
  <style>
    body { margin:0; padding:0; background:#1a202c; display:flex; justify-content:center; align-items:center; min-height:100vh; min-height:100dvh; font-family:Arial,sans-serif; overflow:hidden; }
    #gameContainer { display:flex; justify-content:center; align-items:center; width:100%; height:100vh; height:100dvh; }
    canvas { display:block; width:100%; height:100dvh; touch-action:none; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>
  <script type="module">
    import { renderGameSelector, destroyActiveGame } from './shared/GameSelector.js';

    let activeGame = null;

    async function startGame(id) {
      destroyActiveGame();
      let mod;
      switch (id) {
        case 'butterfly':
          mod = await import('./butterfly-catcher/src/game.js');
          activeGame = new mod.ButterflyCatcherGame();
          break;
        case 'zombie':
          mod = await import('./zombie-catcher/src/game.js');
          activeGame = new mod.ZombieCatcherGame();
          break;
        case 'fishing':
          mod = await import('./fishing-game/src/game.js');
          activeGame = new mod.FishingGame();
          break;
      }
      if (activeGame) activeGame.start();
    }

    renderGameSelector(startGame);
  </script>
</body>
</html>
