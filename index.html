<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butterfly Catcher</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #1a202c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    #gameContainer {
      text-align: center;
    }
    canvas {
      border: 2px solid #4a5568;
      border-radius: 8px;
    }
    h1 {
      color: #e2e8f0;
      margin-bottom: 10px;
    }
    .controls {
      color: #a0aec0;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <h1>Butterfly Catcher</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="controls">WASD/Arrows to move. Go to HOUSE to deposit butterflies.</div>
  </div>
  <script type="module">
    import { ButterflyCatcherGame } from './butterfly-catcher/src/game.js';
    
    const game = new ButterflyCatcherGame();
    game.start();
  </script>
</body>
</html>
